name: Feature proposal
description: Propose a bounded public capability or contract change.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership boundary
      description: Explain why HOP, rather than a caller or study, should own this behavior.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: State inputs, outputs, failure behavior, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
