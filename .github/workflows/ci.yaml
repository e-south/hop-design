name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    # Extended qualification has exceeded two hours on this runner. Keep a
    # finite ceiling without discarding a completed source suite at that point.
    timeout-minutes: 240
    env:
      UV_PYTHON: "3.12"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Select verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_scope.py
      - name: Require a known verification scope
        env:
          CI_SCOPE: ${{ steps.scope.outputs.scope }}
          CI_DISTRIBUTION: ${{ steps.scope.outputs.distribution }}
        run: |
          case "$CI_SCOPE" in
            artwork|full) ;;
            *) echo "Missing or invalid verification scope" >&2; exit 1 ;;
          esac
          case "$CI_DISTRIBUTION" in
            routine|extended) ;;
            *) echo "Missing or invalid distribution mode" >&2; exit 1 ;;
          esac
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
      - name: Verify repository
        if: steps.scope.outputs.scope == 'full'
        env:
          CI_DISTRIBUTION: ${{ steps.scope.outputs.distribution }}
        run: bash ./scripts/agent-verify --workers 2 --distribution "$CI_DISTRIBUTION"
      - name: Verify README artwork
        if: steps.scope.outputs.scope == 'artwork'
        run: |
          bash ./scripts/agent-preflight --strict
          bash ./scripts/precommit-all
          uv run --locked pytest -q tests/repo/test_ci_scope.py tests/repo/test_supply_chain_contracts.py
          uv build --no-sources --out-dir .artifacts/ci-distributions
          uv run --locked twine check .artifacts/ci-distributions/*
      - name: Upload coverage to Codecov
        if: >-
          steps.scope.outputs.scope == 'full' &&
          (github.event_name != 'pull_request' ||
            (github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: .artifacts/coverage.xml
          fail_ci_if_error: true
      - name: Retain verification diagnostics
        if: always() && steps.scope.outputs.scope == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-diagnostics
          path: |
            .artifacts/verification/*.xml
            .artifacts/verification/install-*/result/*.json
            .artifacts/verification/install-*/result/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 3

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: verify
    if: always()
    steps:
      - name: Require successful jobs
        run: |
          test "${{ needs.verify.result }}" = "success"
