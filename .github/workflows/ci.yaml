name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Verify repository
        run: bash ./scripts/agent-verify
      - name: Upload coverage to Codecov
        if: >-
          github.event_name != 'pull_request' ||
          (github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: .artifacts/coverage.xml
          fail_ci_if_error: true

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Test installed package
        run: >-
          uv run --locked --python ${{ matrix.python-version }}
          pytest -q --no-cov tests/contract tests/integration

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, python-compatibility]
    if: always()
    steps:
      - name: Require successful jobs
        run: |
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.python-compatibility.result }}" = "success"
