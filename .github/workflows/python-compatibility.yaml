name: Python compatibility

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
      - name: Test contracts and integration on the selected Python
        run: >-
          uv run --locked --python ${{ matrix.python-version }}
          pytest -q -n 2 --dist loadscope --no-cov tests/contract tests/integration
