name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/python-compatibility.yaml

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Verify tag matches project version
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${project_version}"
      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Build distributions without workspace sources
        run: uv build --no-sources
      - name: Verify exact release distributions
        run: bash ./scripts/wheel-smoke dist
      - name: Record distribution checksums
        run: (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Stage verified distributions for attachment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hop-design-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified GitHub release
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified distributions from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --name hop-design-distributions --dir dist
      - name: Create the release with verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME#v}" =~ [[:alpha:]] ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft \
            --verify-tag \
            --generate-notes \
            "${release_flags[@]}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false

  pypi:
    name: Publish verified package to PyPI
    needs: [build, compatibility, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hop-design
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the verified distributions from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --name hop-design-distributions --dir dist
      - name: Confirm the exact verified bytes before upload
        run: |
          mv dist/SHA256SUMS SHA256SUMS
          (cd dist && sha256sum -c ../SHA256SUMS)
      - name: Publish with a short-lived PyPI identity
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
