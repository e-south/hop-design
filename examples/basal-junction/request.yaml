schema: hop.local-neighborhood-request/v6
name: loxp-basal-junction
payload:
  schema: hop.final-payload/v1
  display_name: loxP reference substrate
  payload:
    kind: exact
    sequence: ATAACTTCGTATAGCATACATTATACGAAGTTAT
  basal_boundary: {offset: 0}
  foldback_boundary: {offset: 34}
  pair_state_exceptions: []
family: basal
route_family: linear_source/v1
endpoint: clone_ready_duplex
geometry_domain:
  family: basal
  nick_strand: any
  nick_offsets_nt: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  pairing_constraints:
    - {position_from_ligation: 0, allowed_class: match}
    - {position_from_ligation: 1, allowed_class: match}
    - {position_from_ligation: 2, allowed_class: match}
    - {position_from_ligation: 3, allowed_class: match}
  minimum_adapter_annealing_nt: 15
  mismatch_warning_fraction: 0.2
  future_release:
    recognition_material: source_duplex
    orientation: reverse
    product_end: right
    overhang_end: five_prime
    cohesive_end_sequence: NNNN
hard_constraints:
  preserve_payload: true
  forbid_unintended_actionable_sites: true
  require_all_members_compatible: false
preferences:
  retained_construction: compact
  payload_compatibility: report
  ranking: none
  preferred_enzyme_ids: []
enzyme_provisioning:
  catalog:
    schema: hop/characterized-enzyme-catalog/v1
    catalog_id: example:enzyme-catalog/basal-junction@1
    enzymes:
      - schema: hop/characterized-enzyme/v1
        enzyme_id: enzyme:nt-bsmai@1
        canonical_name: Nt.BsmAI
        enzyme_class: nickase
        target_molecule: dna
        recognition_pattern: GTCTC
        recognition_orientation_semantics: both_orientations
        recognition_length: 5
        substrate_requirement: duplex_dna
        cut_offset_reference_strand: 6
        cut_offset_complement_strand: null
        resulting_end_model: nick
        characterization_source:
          system: NEB
          kind: recognition-and-cleavage-definition
          id: https://www.neb.com/en-us/products/r0121-ntbsmai
        vendor_metadata: []
      - schema: hop/characterized-enzyme/v1
        enzyme_id: enzyme:bbsi@1
        canonical_name: BbsI
        enzyme_class: duplex_restriction
        target_molecule: dna
        recognition_pattern: GAAGAC
        recognition_orientation_semantics: both_orientations
        recognition_length: 6
        substrate_requirement: duplex_dna
        cut_offset_reference_strand: 8
        cut_offset_complement_strand: 12
        resulting_end_model: duplex_break
        characterization_source:
          system: NEB
          kind: recognition-and-cleavage-definition
          id: https://www.neb.com/en-us/tools-and-resources/selection-charts/alphabetized-list-of-recognition-specificities
        vendor_metadata: []
  allowed_enzyme_ids: [enzyme:nt-bsmai@1, enzyme:bbsi@1]
  forbidden_enzyme_ids: []
  reserved_enzyme_ids: []
  max_operations: 2
  role_restrictions:
    - role: basal_nick
      allowed_enzyme_ids: [enzyme:nt-bsmai@1]
    - role: end_generation
      allowed_enzyme_ids: [enzyme:bbsi@1]
search:
  max_retained_overhead_nt: 8
  max_search_nodes: 100000
  max_realizations: 100000
  scope: existence
  stop: exhaustive
