<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">hop — HAIRPIN OLIGONUCLEOTIDE PROCESSING</title>
  <desc id="desc">Specify a payload and search its basal and foldback flanks.
    In the illustrated linear-source route, primer copying prepares a duplex.
    Cleavage followed by strand separation exposes a foldback region; pairing
    and a covalent join close the hairpin. The payload and its copied partner
    remain orange. Schematic, not to scale; auxiliary oligos are omitted.</desc>
  <rect width="1280" height="340" fill="#1E1D1A"/>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8" fill="#969087"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="77" fill="#F3EFE7" font-family="Menlo, Monaco, Consolas, monospace"
      font-size="68" font-weight="700" letter-spacing="-3">hop</text>
    <text x="220" y="77" fill="#F3EFE7" font-size="30">Design the flanks. Preserve the payload.</text>
    <path d="M222 111H246" stroke="#D97757" stroke-width="9"/>
    <text x="257" y="117" fill="#C5BFB5" font-size="17">payload</text>

    <g data-stage="source-ssdna" transform="translate(56 0)">
      <title>Source ssDNA: basal flank, invariant payload, foldback flank</title>
      <path d="M0 176H156" stroke="#F3EFE7" stroke-width="9"/>
      <path d="M50 176H108" stroke="#D97757" stroke-width="9"/>
      <text x="78" y="280" fill="#F3EFE7" font-size="22" text-anchor="middle">Source ssDNA</text>
    </g>
    <g data-operation="template-copy">
      <path d="M245 176H281" stroke="#969087" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="263" y="147" fill="#C5BFB5" font-size="16" text-anchor="middle">PCR</text>
    </g>
    <g data-stage="source-duplex" transform="translate(298 0)">
      <title>Source duplex before cleavage: the source strand and its copied complement</title>
      <path d="M16 159V193M47 159V193M78 159V193M109 159V193M140 159V193"
        stroke="#969087" stroke-width="2"/>
      <path d="M0 159H156M0 193H156" stroke="#F3EFE7" stroke-width="9"/>
      <path d="M50 159H108M50 193H108" stroke="#D97757" stroke-width="9"/>
      <text x="78" y="280" fill="#F3EFE7" font-size="22" text-anchor="middle">Duplex</text>
    </g>
    <g data-operation="cleave-and-separate">
      <path d="M467 176H524" stroke="#969087" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="496" y="131" fill="#C5BFB5" font-size="16" text-anchor="middle">cleave</text>
      <text x="496" y="151" fill="#C5BFB5" font-size="16" text-anchor="middle">+ separate</text>
    </g>
    <g data-stage="strand-exposure" transform="translate(540 0)">
      <title>Strand exposure: retained strands and a separated sacrificial fragment</title>
      <path d="M0 151H156M0 193H108" stroke="#F3EFE7" stroke-width="9"/>
      <path d="M50 151H108M50 193H108" stroke="#D97757" stroke-width="9"/>
      <path id="removed-fragment" d="M114 235H156" stroke="#969087" stroke-width="9" opacity="0.6"/>
      <path d="M135 198V221" stroke="#969087" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="78" y="280" fill="#F3EFE7" font-size="22" text-anchor="middle">Exposed strand</text>
    </g>
    <g data-operation="associate">
      <path d="M709 176H767" stroke="#969087" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="738" y="136" fill="#C5BFB5" font-size="16" text-anchor="middle">anneal</text>
    </g>
    <g data-stage="foldback" transform="translate(782 0)">
      <title>Foldback pairing: a curved cap with an unjoined backbone boundary</title>
      <path d="M16 151V185M47 151V185M78 151V185M109 151V185M140 151V185"
        stroke="#969087" stroke-width="2"/>
      <path d="M0 151H140A17 17 0 0 1 140 185H118M0 185H108"
        stroke="#F3EFE7" stroke-width="9"/>
      <path d="M50 151H108M50 185H108" stroke="#D97757" stroke-width="9"/>
      <text x="78" y="280" fill="#F3EFE7" font-size="22" text-anchor="middle">Foldback</text>
    </g>
    <g data-operation="join">
      <path d="M954 176H1009" stroke="#969087" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="981" y="136" fill="#C5BFB5" font-size="16" text-anchor="middle">join</text>
    </g>
    <g data-stage="hairpin" transform="translate(1024 0)">
      <title>Unimolecular hairpin: payload and copied partner on one continuous backbone</title>
      <path d="M16 151V185M47 151V185M78 151V185M109 151V185M140 151V185"
        stroke="#969087" stroke-width="2"/>
      <path id="hairpin-backbone" d="M0 151H140A17 17 0 0 1 140 185H0"
        stroke="#F3EFE7" stroke-width="9"/>
      <path d="M50 151H108M50 185H108" stroke="#D97757" stroke-width="9"/>
      <path id="joining-bond" d="M108 185H118" stroke="#F3EFE7" stroke-width="9"/>
      <text x="78" y="280" fill="#F3EFE7" font-size="22" text-anchor="middle">Hairpin</text>
    </g>
  </g>
</svg>
